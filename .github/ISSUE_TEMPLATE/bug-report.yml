name: Bug report
description: Report a defect in the scanner, action, or assurance workflow.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: Describe the failure and the impact.
      placeholder: Rock House reported a false positive on...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Include commands, config, and the smallest reproducible case.
      placeholder: |
        1. Run `node scripts/rock-house-ci.js --config ...`
        2. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: The scan should...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node version, runner OS, GitHub Actions usage, and relevant stack.
      placeholder: Node 20, windows-latest, Next.js 16, GitHub Action v0.1.0
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Report excerpt
      description: Paste the relevant finding, gate, or error output.
      render: text
