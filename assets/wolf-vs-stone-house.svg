<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#87CEEB"/>
  
  <!-- Ground -->
  <rect y="450" width="800" height="150" fill="#90EE90"/>
  
  <!-- Stone House - Solid Defense -->
  <g id="stone-house">
    <!-- Foundation -->
    <rect x="500" y="350" width="200" height="100" fill="#696969" stroke="#2F4F4F" stroke-width="3"/>
    
    <!-- Stone blocks pattern -->
    <g stroke="#2F4F4F" stroke-width="2" fill="none">
      <!-- Horizontal lines -->
      <line x1="500" y1="375" x2="700" y2="375"/>
      <line x1="500" y1="400" x2="700" y2="400"/>
      <line x1="500" y1="425" x2="700" y2="425"/>
      <!-- Vertical lines -->
      <line x1="537.5" y1="350" x2="537.5" y2="450"/>
      <line x1="575" y1="350" x2="575" y2="450"/>
      <line x1="612.5" y1="350" x2="612.5" y2="450"/>
      <line x1="650" y1="350" x2="650" y2="450"/>
    </g>
    
    <!-- Roof -->
    <polygon points="500,350 600,250 700,350" fill="#8B4513" stroke="#654321" stroke-width="2"/>
    
    <!-- Door -->
    <rect x="570" y="390" width="60" height="60" fill="#D2691E" stroke="#654321" stroke-width="2"/>
    <circle cx="625" cy="420" r="4" fill="#FFD700"/>
    
    <!-- Window -->
    <rect x="520" y="370" width="30" height="30" fill="#87CEEB" stroke="#654321" stroke-width="2"/>
    <line x1="535" y1="370" x2="535" y2="400" stroke="#654321" stroke-width="1"/>
    <line x1="520" y1="385" x2="550" y2="385" stroke="#654321" stroke-width="1"/>
    
    <!-- Confidence shine/glow -->
    <circle cx="600" cy="280" r="40" fill="#FFD700" opacity="0.3"/>
  </g>
  
  <!-- Angry Wolf - Attack Attempt -->
  <g id="wolf" transform="translate(150, 320)">
    <!-- Body (muscular, aggressive) -->
    <ellipse cx="80" cy="50" rx="50" ry="35" fill="#555555" stroke="#2F4F4F" stroke-width="2"/>
    
    <!-- Head -->
    <circle cx="150" cy="30" r="35" fill="#555555" stroke="#2F4F4F" stroke-width="2"/>
    
    <!-- Snout (aggressive) -->
    <ellipse cx="180" cy="35" rx="25" ry="20" fill="#666666" stroke="#2F4F4F" stroke-width="2"/>
    
    <!-- Nose -->
    <ellipse cx="200" cy="35" rx="6" ry="5" fill="#1a1a1a"/>
    
    <!-- Mouth (snarling) -->
    <path d="M 200 35 L 210 30 M 200 35 L 210 40" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- Teeth -->
    <g fill="#FFFFFF" stroke="#1a1a1a" stroke-width="1">
      <rect x="205" y="28" width="3" height="4"/>
      <rect x="210" y="27" width="3" height="5"/>
      <rect x="215" y="28" width="3" height="4"/>
    </g>
    
    <!-- Eyes (intense, angry) -->
    <circle cx="140" cy="20" r="5" fill="#FF4500"/>
    <circle cx="165" cy="20" r="5" fill="#FF4500"/>
    <circle cx="142" cy="18" r="2" fill="#000000"/>
    <circle cx="167" cy="18" r="2" fill="#000000"/>
    
    <!-- Eyebrows (angry expression) -->
    <path d="M 135 15 L 145 12" stroke="#2F4F4F" stroke-width="2" stroke-linecap="round"/>
    <path d="M 160 12 L 170 15" stroke="#2F4F4F" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Ears (alert, aggressive) -->
    <polygon points="125,5 120,0 130,10" fill="#555555" stroke="#2F4F4F" stroke-width="1"/>
    <polygon points="175,5 180,0 170,10" fill="#555555" stroke="#2F4F4F" stroke-width="1"/>
    <polygon points="126,7 123,3 128,9" fill="#FF6B6B"/>
    <polygon points="174,7 177,3 172,9" fill="#FF6B6B"/>
    
    <!-- Front legs (attack stance) -->
    <rect x="110" y="75" width="15" height="50" fill="#555555" stroke="#2F4F4F" stroke-width="2" transform="rotate(-15 117.5 75)"/>
    <rect x="135" y="80" width="15" height="45" fill="#555555" stroke="#2F4F4F" stroke-width="2" transform="rotate(10 142.5 80)"/>
    
    <!-- Paws -->
    <ellipse cx="110" cy="125" rx="8" ry="6" fill="#444444" stroke="#2F4F4F" stroke-width="1"/>
    <ellipse cx="145" cy="120" rx="8" ry="6" fill="#444444" stroke="#2F4F4F" stroke-width="1"/>
    
    <!-- Back legs -->
    <rect x="55" y="80" width="12" height="45" fill="#555555" stroke="#2F4F4F" stroke-width="2"/>
    <ellipse cx="61" cy="125" rx="7" ry="5" fill="#444444" stroke="#2F4F4F" stroke-width="1"/>
    
    <!-- Tail (aggressive, raised) -->
    <path d="M 35 50 Q 10 30 15 5" stroke="#555555" stroke-width="18" fill="none" stroke-linecap="round"/>
    
    <!-- Fur spikes (aggression) -->
    <g stroke="#333333" stroke-width="2" fill="none">
      <line x1="100" y1="15" x2="95" y2="5"/>
      <line x1="110" y1="10" x2="108" y2="0"/>
      <line x1="50" y1="30" x2="40" y2="25"/>
      <line x1="45" y1="45" x2="35" y2="42"/>
    </g>
    
    <!-- Attack lines (speed/intensity) -->
    <g stroke="#FF4500" stroke-width="2" opacity="0.7" stroke-dasharray="5,5">
      <line x1="0" y1="40" x2="-30" y2="40"/>
      <line x1="5" y1="55" x2="-20" y2="60"/>
    </g>
  </g>
  
  <!-- Impact/Collision effect -->
  <g id="impact" opacity="0.8">
    <circle cx="280" cy="320" r="60" fill="none" stroke="#FF4500" stroke-width="3" stroke-dasharray="10,5" opacity="0.6"/>
    <circle cx="280" cy="320" r="75" fill="none" stroke="#FFD700" stroke-width="2" stroke-dasharray="15,5" opacity="0.4"/>
  </g>
  
  <!-- Stone particles (defense resisting) -->
  <g id="particles" fill="#696969" opacity="0.7">
    <rect x="295" y="300" width="8" height="8" transform="rotate(30)"/>
    <rect x="310" y="310" width="6" height="6" transform="rotate(60)"/>
    <rect x="305" y="290" width="7" height="7" transform="rotate(45)"/>
    <circle cx="320" cy="305" r="4"/>
    <circle cx="290" cy="315" r="3"/>
  </g>
  
  <!-- Labels -->
  <text x="600" y="550" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2F4F4F" text-anchor="middle">
    DEFESA EM PEDRA
  </text>
  
  <text x="150" y="550" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#8B0000" text-anchor="middle">
    TENTATIVA DE ATAQUE
  </text>
  
  <!-- Legend -->
  <text x="20" y="30" font-family="Arial, sans-serif" font-size="12" fill="#2F4F4F">
    🐺 Lobo = Ameaça Externa
  </text>
  <text x="20" y="50" font-family="Arial, sans-serif" font-size="12" fill="#2F4F4F">
    🏠 Pedra = Defesa Independente
  </text>
  <text x="20" y="70" font-family="Arial, sans-serif" font-size="12" fill="#FFD700">
    ✓ Confiança na Segurança
  </text>
</svg>